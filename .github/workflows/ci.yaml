name: Scratchpad CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Tests
        run: npm run test -- --passWithNoTests

      - name: Build App
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: NODE_OPTIONS="--max-old-space-size=4096" npm run build

      - name: Restart Application
        run: |
          pm2 stop scratchpad || true
          pm2 delete scratchpad || true
          cd /home/ec2-user/actions-runner/_work/scratchpad/scratchpad
          pm2 start npm --name scratchpad -- start --update-env
          pm2 save


          